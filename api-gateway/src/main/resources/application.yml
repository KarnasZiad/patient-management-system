server:
  port: ${SERVER_PORT:4004}

# Downstream service URLs. Defaults target the docker-compose network;
# override with AUTH_SERVICE_URL / PATIENT_SERVICE_URL (e.g. on ECS / LocalStack).
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:4005}
patient:
  service:
    url: ${PATIENT_SERVICE_URL:http://patient-service:4000}

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${auth.service.url}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # Route for /api/patients/** to patient-service
        - id: patient-service-route
          uri: ${patient.service.url}
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # Route for /api-docs/patients to patient-service /v3/api-docs
        - id: api-docs-patient-route
          uri: ${patient.service.url}
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        - id: api-docs-auth-route
          uri: ${auth.service.url}
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs
