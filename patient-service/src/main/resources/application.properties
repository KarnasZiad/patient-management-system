spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

server.port=4000
logging.level.root=info

# Billing service (gRPC) - override with BILLING_SERVICE_ADDRESS / BILLING_SERVICE_GRPC_PORT
billing.service.address=localhost
billing.service.grpc.port=9001
billing.service.grpc.deadline=5s

# Kafka topic shared with analytics-service
kafka.topic.patient=patient
